
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вселенная моей любви ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #02010a;
  color: white;
  font-family: Georgia, serif;
}

canvas {
  display: block;
  position: fixed;
  inset: 0;
}

.overlay {
  position: fixed;
  z-index: 2;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  text-align: center;
  pointer-events: none;
  padding: 20px;
  background: radial-gradient(
    ellipse at center,
    transparent 0%,
    rgba(2, 1, 10, 0.08) 45%,
    rgba(2, 1, 10, 0.45) 100%
  );
}

h1 {
  font-size: clamp(32px, 7vw, 76px);
  font-weight: normal;
  letter-spacing: 3px;
  color: #fff0fb;
  text-shadow:
    0 0 15px #ff6bd6,
    0 0 40px #a45bff,
    0 0 80px #7745ff;
  animation: glow 3s ease-in-out infinite alternate;
}

.subtitle {
  margin-top: 20px;
  color: #d5c8ff;
  font-size: clamp(14px, 2vw, 19px);
  letter-spacing: 2px;
  line-height: 1.8;
}

.hint {
  position: fixed;
  bottom: 35px;
  left: 0;
  width: 100%;
  text-align: center;
  color: #c7b7ef;
  font: 13px Arial, sans-serif;
  letter-spacing: 1px;
  z-index: 3;
  pointer-events: none;
}

#loveWords {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

.word {
  position: absolute;
  transform: translate(-50%, -50%);
  white-space: nowrap;
  color: #fff3ff;
  font-size: clamp(15px, 2vw, 25px);
  text-shadow:
    0 0 8px #ff7ae5,
    0 0 20px #b56cff,
    0 0 35px #804aff;
  animation: appear 2s ease forwards;
}

@keyframes glow {
  from { opacity: .8; filter: brightness(.9); }
  to { opacity: 1; filter: brightness(1.3); }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translate(-50%, -50%) scale(.3);
    filter: blur(8px);
  }
  to {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    filter: blur(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  h1 { animation: none; }
}
</style>
</head>

<body>
<canvas id="space"></canvas>

<div class="overlay">
  <h1>Наша Вселенная</h1>
  <div class="subtitle">
    В бесконечности космоса<br>
    есть только одно главное — ты ❤️
  </div>
</div>

<div id="loveWords"></div>

<div class="hint">
  ПРИБЛИЖАЙ ГАЛАКТИКУ · КОЛЁСИКО МЫШИ ИЛИ ЖЕСТОМ
</div>

<script>
const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");
const wordsLayer = document.getElementById("loveWords");

let w, h, stars = [];
let zoom = 1;
let targetZoom = 1;
let rotation = 0;
let lastWordCount = 0;

const phrases = [
  "Я люблю тебя ❤️",
  "I love you",
  "Je t’aime",
  "Te amo",
  "Ich liebe dich",
  "Ti amo",
  "Eu te amo",
  "愛してる",
  "사랑해",
  "我爱你",
  "أنا أحبك",
  "Я тебя кохаю",
  "Ik hou van jou",
  "Seni seviyorum",
  "Εγώ σ’ αγαπώ",
  "আমি তোমাকে ভালোবাসি",
  "मैं तुमसे प्यार करता हूँ",
  "Mahal kita",
  "Kocham cię",
  "Jeg elsker deg",
  "Szeretlek",
  "Volim te",
  "Te iubesc",
  "Aš tave myliu",
  "ฉันรักคุณ",
  "હું તને પ્રેમ કરું છું",
  "ฉันรักเธอ",
  "Mi amas vin",
  "אני אוהב אותך",
  "Minä rakastan sinua",
  "Ik zie je graag",
  "Люблю тебе",
  "T'estimo",
  "Ngiyakuthanda",
  "Mo nifẹ rẹ",
  "Aloha wau iā ʻoe"
];

function resize() {
  w = canvas.width = window.innerWidth;
  h = canvas.height = window.innerHeight;

  stars = Array.from({ length: 1800 }, () => ({
    angle: Math.random() * Math.PI * 2,
    radius: Math.random() ** 0.65,
    size: Math.random() * 1.8 + .2,
    depth: Math.random() * .8 + .2,
    color: Math.random() > .85
      ? "#f6a9ff"
      : Math.random() > .5 ? "#a6c7ff" : "#ffffff"
  }));
}

function drawGalaxy(time) {
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2;
  const cy = h / 2;
  const radius = Math.min(w, h) * .43 * zoom;

  // Светящееся ядро
  const core = ctx.createRadialGradient(
    cx, cy, 0, cx, cy, radius * .45
  );
  core.addColorStop(0, "rgba(255,230,255,.95)");
  core.addColorStop(.08, "rgba(255,130,245,.35)");
  core.addColorStop(.35, "rgba(145,75,255,.13)");
  core.addColorStop(1, "rgba(2,1,10,0)");

  ctx.fillStyle = core;
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);

  // Спиральные рукава галактики
  for (let arm = 0; arm < 4; arm++) {
    for (let i = 0; i < 650; i++) {
      const t = i / 650;
      const r = t * radius;
      const angle =
        t * 7.5 + arm * Math.PI / 2 +
        Math.sin(t * 12) * .18;

      const scatter = (1 - t) * 13 + 2;
      const x = Math.cos(angle) * r +
        (Math.random() - .5) * scatter;
      const y = Math.sin(angle) * r * .48 +
        (Math.random() - .5) * scatter;

      ctx.beginPath();
      ctx.arc(x, y, Math.random() * 1.5 + .3, 0, Math.PI * 2);
      ctx.fillStyle = Math.random() > .7
        ? "rgba(255,150,245,.8)"
        : "rgba(170,180,255,.65)";
      ctx.fill();
    }
  }

  // Звёзды
  for (const star of stars) {
    const r = star.radius * radius * 1.4;
    const angle = star.angle + time * .000015 * star.depth;
    const x = Math.cos(angle) * r;
    const y = Math.sin(angle) * r * .55;

    ctx.globalAlpha =
      .35 + .65 * Math.abs(Math.sin(time * .001 + star.angle));

    ctx.fillStyle = star.color;
    ctx.beginPath();
    ctx.arc(x, y, star.size * star.depth, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalAlpha = 1;
  ctx.restore();

  rotation += .0005;
}

function updateWords() {
  // Чем ближе галактика, тем больше признаний
  const count = Math.min(
    phrases.length,
    Math.max(0, Math.floor((zoom - 1) * 7))
  );

  if (count === lastWordCount) return;
  lastWordCount = count;

  wordsLayer.innerHTML = "";

  for (let i = 0; i < count; i++) {
    const word = document.createElement("div");
    word.className = "word";
    word.textContent = phrases[i];

    // Слова располагаются вокруг галактики
    const angle = i * 2.39996;
    const distance = 8 + Math.sqrt(i + 1) * 8;
    const x = 50 + Math.cos(angle) * distance;
    const y = 50 + Math.sin(angle) * distance * .65;

    word.style.left = `${Math.max(8, Math.min(92, x))}%`;
    word.style.top = `${Math.max(12, Math.min(88, y))}%`;
    word.style.animationDelay = `${(i % 8) * .12}s`;
    word.style.fontSize = `${15 + Math.min(zoom, 4) * 2}px`;

    wordsLayer.appendChild(word);
  }
}

function animate(time) {
  zoom += (targetZoom - zoom) * .07;
  drawGalaxy(time);
  updateWords();
  requestAnimationFrame(animate);
}

// Масштабирование колёсиком мыши
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  targetZoom = Math.max(
    1, Math.min(5, targetZoom - e.deltaY * .002)
  );
}, { passive: false });

// Приближение и отдаление пальцами
let initialDistance = 0;
let initialZoom = 1;

function touchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.hypot(dx, dy);
}

canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 2) {
    initialDistance = touchDistance(e.touches);
    initialZoom = targetZoom;
  }
}, { passive: true });

canvas.addEventListener("touchmove", e => {
  if (e.touches.length === 2) {
    e.preventDefault();
    targetZoom = Math.max(1, Math.min(
      5,
      initialZoom * touchDistance(e.touches) / initialDistance
    ));
  }
}, { passive: false });

// Клик тоже приближает галактику
canvas.addEventListener("click", () => {
  targetZoom = targetZoom >= 4.8 ? 1 : targetZoom + .5;
});

window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);
</script>
</body>
</html>
